<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Dealer Conclave - Award Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 95%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .controls-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .preview-section {
            flex: 2;
            min-width: 300px;
            text-align: center;
        }

        h1 { margin-top: 0; color: #e31e24; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }
        
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .slider-group {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #eee; /* Shows transparency */
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #e31e24;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 20px;
            cursor: pointer;
            border: none;
        }

        .download-btn:hover { background-color: #c41217; }
        
        .file-upload-label {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls-section">
            <h1>Award Generator</h1>
            
            <div>
                <label>1. Upload Photo</label>
                <label for="file-upload" class="file-upload-label">📂 Choose Image File</label>
                <input id="file-upload" type="file" accept="image/*" style="display:none;">
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee;">

            <div>
                <label>2. Enter Details</label>
                <input type="text" id="line1" placeholder="Name (e.g., Athira Marketing)" value="Athira Marketing">
                <input type="text" id="line2" placeholder="Location (e.g., Palakkad)" value="Palakkad" style="margin-top: 8px;">
            </div>

            <div class="slider-group">
                <label>Text Position (Move X / Y)</label>
                <input type="range" id="posX" min="-200" max="200" value="0">
                <input type="range" id="posY" min="-200" max="200" value="0">
            </div>

            <div class="slider-group">
                <label>Font Size</label>
                <input type="range" id="fontSize" min="20" max="100" value="45">
            </div>

            <a id="download-link" class="download-btn">Download Final Image</a>
        </div>

        <div class="preview-section">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const line1Input = document.getElementById('line1');
        const line2Input = document.getElementById('line2');
        const posXSlider = document.getElementById('posX');
        const posYSlider = document.getElementById('posY');
        const fontSizeSlider = document.getElementById('fontSize');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadLink = document.getElementById('download-link');

        // *** CONFIGURATION ***
        const frameSrc = './frame.png'; // MUST be the transparent PNG
        let frameImg = new Image();
        let userImg = new Image();
        let isUserImgLoaded = false;

        // Default position logic (Percentages of canvas size)
        // These align with the white box in your "FRAME.jpg"
        const textBaseXRatio = 0.655; // 65.5% from left
        const textBaseYRatio = 0.90;  // 90% from top

        frameImg.crossOrigin = "anonymous";
        frameImg.src = frameSrc;

        frameImg.onload = function() {
            canvas.width = frameImg.width;
            canvas.height = frameImg.height;
            draw();
        };

        // Event Listeners for Real-time updates
        [line1Input, line2Input, posXSlider, posYSlider, fontSizeSlider].forEach(el => {
            el.addEventListener('input', draw);
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                userImg = new Image();
                userImg.onload = function() {
                    isUserImgLoaded = true;
                    draw();
                }
                userImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function draw() {
            // 1. Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Draw User Image (Scaled & Centered)
            if (isUserImgLoaded) {
                // Calculate "Cover" fit
                const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                const x = (canvas.width / 2) - (userImg.width / 2) * scale;
                const y = (canvas.height / 2) - (userImg.height / 2) * scale;
                
                ctx.drawImage(userImg, x, y, userImg.width * scale, userImg.height * scale);
            } else {
                // Placeholder grey background if no image
                ctx.fillStyle = "#e0e0e0";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#666";
                ctx.font = "40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Upload a photo to begin", canvas.width/2, canvas.height/2);
            }

            // 3. Draw Frame
            ctx.drawImage(frameImg, 0, 0);

            // 4. Draw Text
            const fontSize = parseInt(fontSizeSlider.value);
            const offsetX = parseInt(posXSlider.value);
            const offsetY = parseInt(posYSlider.value);

            // Calculate base position relative to frame size
            const baseX = canvas.width * textBaseXRatio;
            const baseY = canvas.height * textBaseYRatio;

            ctx.textAlign = "center"; 
            ctx.fillStyle = "black"; // Text Color

            // Line 1 (Name) - Bold
            ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
            ctx.fillText(line1Input.value, baseX + offsetX, baseY + offsetY);

            // Line 2 (Location) - Regular, slightly smaller
            ctx.font = `${fontSize * 0.7}px 'Segoe UI', sans-serif`;
            // Position line 2 below line 1 (spacing based on font size)
            ctx.fillText(line2Input.value, baseX + offsetX, baseY + offsetY + (fontSize * 1.1));

            // 5. Update Download Link
            downloadLink.href = canvas.toDataURL('image/png');
            downloadLink.download = `Award_${line1Input.value.replace(/\s+/g, '_')}.png`;
        }
    </script>
</body>
</html>
